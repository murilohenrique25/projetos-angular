<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>
                <mat-icon color="primary">restaurant</mat-icon>
                Delivery Express
            </mat-card-title>
            <mat-card-subtitle>Painel Administrativo</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" formControlName="email" placeholder="admin@deliveryexpress.com">
                    <mat-icon matSuffix>email</mat-icon>
                    <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
                        Email é obrigatório
                    </mat-error>
                    <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
                        Email inválido
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Senha</mat-label>
                    <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                        placeholder="admin123">
                    <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
                        <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                        Senha é obrigatória
                    </mat-error>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" class="full-width"
                    [disabled]="loginForm.invalid || loading">
                    <mat-spinner *ngIf="loading" diameter="20" class="mr-2"></mat-spinner>
                    {{ loading ? 'Entrando...' : 'Entrar' }}
                </button>
            </form>

            <div class="credentials-hint">
                <p><small>
                        <strong>Credenciais de teste:</strong><br>

                    </small></p>
            </div>
        </mat-card-content>
    </mat-card>
</div>
