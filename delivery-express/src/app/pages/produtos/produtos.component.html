<div class="produtos-page">
    <div class="page-header">
        <h1>Gestão de Produtos</h1>
        <button mat-raised-button color="primary" (click)="openProdutoDialog()">
            <mat-icon>add</mat-icon>
            Novo Produto
        </button>
    </div>

    <mat-card>
        <mat-card-header>
            <mat-card-title>Lista de Produtos</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <table mat-table [dataSource]="produtos" class="full-width">
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef>Nome</th>
                    <td mat-cell *matCellDef="let produto">
                        <div class="produto-info">
                            <strong>{{produto.nome}}</strong>
                            <small>{{produto.categoria}}</small>
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="preco">
                    <th mat-header-cell *matHeaderCellDef>Preço</th>
                    <td mat-cell *matCellDef="let produto">
                        <div class="preco-info">
                            <span *ngIf="produto.promocao" class="preco-original">R$ {{produto.preco.toFixed(2)}}</span>
                            <span [class]="produto.promocao ? 'preco-promocao' : 'preco-normal'">
                                R$ {{produto.promocao ? produto.precoPromocao?.toFixed(2) : produto.preco.toFixed(2)}}
                            </span>
                            <span *ngIf="produto.promocao" class="promocao-badge">OFERTA</span>
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let produto">
                        <span [class]="'status-badge ' + (produto.ativo ? 'status-ativo' : 'status-inativo')">
                            {{produto.ativo ? 'Ativo' : 'Inativo'}}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="acoes">
                    <th mat-header-cell *matHeaderCellDef>Ações</th>
                    <td mat-cell *matCellDef="let produto">
                        <button mat-icon-button color="primary" (click)="editProduto(produto)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteProduto(produto.id)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
