<div class="sidebar">
      <mat-toolbar class="sidebar-header" color="primary">
        <mat-icon>restaurant</mat-icon>
        <span class="ml-2">Delivery Express</span>
      </mat-toolbar>

      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListIcon>dashboard</mat-icon>
          <span matLine>Dashboard</span>
        </a>

        <a mat-list-item routerLink="/produtos" routerLinkActive="active-link">
          <mat-icon matListIcon>restaurant_menu</mat-icon>
          <span matLine>Produtos</span>
        </a>

        <a mat-list-item routerLink="/cupons" routerLinkActive="active-link">
          <mat-icon matListIcon>local_offer</mat-icon>
          <span matLine>Cupons</span>
        </a>

        <a mat-list-item routerLink="/pedidos" routerLinkActive="active-link">
          <mat-icon matListIcon>receipt_long</mat-icon>
          <span matLine>Pedidos</span>
        </a>

        <a mat-list-item routerLink="/relatorios" routerLinkActive="active-link">
          <mat-icon matListIcon>analytics</mat-icon>
          <span matLine>Relatórios</span>
        </a>

        <a mat-list-item routerLink="/configuracoes" routerLinkActive="active-link">
          <mat-icon matListIcon>settings</mat-icon>
          <span matLine>Configurações</span>
        </a>

        <mat-divider class="mt-2 mb-2"></mat-divider>

        <a mat-list-item (click)="logout()">
          <mat-icon matListIcon>logout</mat-icon>
          <span matLine>Sair</span>
        </a>
      </mat-nav-list>
    </div>
